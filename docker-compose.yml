# ---------------------------------------------------------------------------
# docker-compose.yml — Agentic SonarQube Fix Pipeline
#
# Services:
#   app        — FastAPI pipeline API
#   sonarqube  — SonarQube Community Edition
# ---------------------------------------------------------------------------

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount Docker socket so the app can spin up sandboxed test containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist cloned repos across container restarts
      - app_repos:/app/repos
      # Persist the SQLite database
      - app_db:/app/data
    environment:
      # LLM config (override in .env or here)
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      # Point to the user's existing local SonarQube instance
      - SONARQUBE_URL=http://host.docker.internal:9000
      - SONARQUBE_TOKEN=${SONARQUBE_TOKEN}
      # Repos directory inside the container
      - REPOS_DIR=/app/repos
    restart: unless-stopped

volumes:
  app_repos:
  app_db:
